services:
  - type: web
    name: brokerassist-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: BROKERASSIST_HOSTED
        value: "yes"
      - key: BROKERASSIST_MODE
        value: offline
      - key: BROKERASSIST_DEMO_USER
        value: reviewer
      - key: BROKERASSIST_DEMO_PASSWORD
        sync: false
      - key: BROKERASSIST_DB
        value: runtime/hosted-demo.db
